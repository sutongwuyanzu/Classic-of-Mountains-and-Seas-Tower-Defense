appId: com.sutongwuyanzu.shanhaidefense
productName: 山海异兽志
artifactName: ${productName}-Portable-${version}-${arch}.${ext}
directories:
  output: dist
electronDist: node_modules/electron/dist
files:
  - index.html
  - styles.css
  - package.json
  - src/**/*
  - shared/**/*
  - assets/**/*
  - '!assets/**/*-source.png'
  - '!assets/**/*.prompt.txt'
  - '!assets/animations/attacks/*-qc/**/*'
  - electron/**/*
asar: true
win:
  icon: assets/fx/summon-ritual.png
  target:
    - nsis
  signExecutable: false
nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
